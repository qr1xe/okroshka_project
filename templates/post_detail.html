{% extends 'base.html' %}

{% block title %}
{{ post.title }}
{% endblock %}

{% block content %}
<div class="container mt-5">
    <a href="{{ url_for('posts') }}" class="btn btn-secondary mb-4">← Назад ко всем объявлениям</a>

    <h1>{{ post.title }}</h1>
    <hr>
    <p style="white-space: pre-wrap;">{{ post.text }}</p>

    <small class="text-muted">
        {% if post.date %}
            Опубликовано: {{ post.date.strftime('%d.%m.%Y %H:%M') }}
        {% endif %}
    </small>
</div>
{% endblock %}
