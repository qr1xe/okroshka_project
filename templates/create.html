{% extends 'base.html' %}

{% block title %}
Добавление записи
{% endblock %}

{% block content %}
<h1>Добавить автомобиль</h1>

<form method="post">
    <input type="text" name="title" placeholder="Марка автомобиля" class="form-control"><br>
    <textarea name="text" placeholder="Описание автомобиля и условия аренды" class="form-control" rows="6"></textarea><br>
    <button class="btn btn-success" type="submit">Опубликовать</button>
</form>
{% endblock %}
