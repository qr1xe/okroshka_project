{% extends 'base.html' %}

{% block title %}
Все публикации
{% endblock %}

{% block content %}
<h1>Все публикации</h1>

<div class="row">
  {% for post in posts %}
    <div class="col-md-6 item">
      <a href="{{ url_for('post_detail', id=post.id) }}">
        <div class="item-in">
          <h4>{{ post.title }}</h4>
          <div class="seperator"></div>
          <p>{{ post.text[:120] }}...</p>
        </div>
      </a>
    </div>
  {% endfor %}
</div>
{% endblock %}
