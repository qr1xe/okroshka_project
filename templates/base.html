<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0,
          maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/main.css') }}">

    <title>{% block title %}{% endblock %}</title>
</head>


<body>
<div class="page">
        <header class="d-flex flex-wrap align-items-center justify-content-between py-3 mb-4 border-bottom">

        <div class="col-md-3 mb-2 mb-md-0">
            <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
                <svg class="bi" width="40" height="32" role="img" aria-label="Bootstrap">
                    <use xlink:href="#bootstrap"></use>
                    <img class="header__img"src="{{ url_for('static', filename='img/carrent.png') }}" alt="carrent">
            </a>
        </div>

        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="{{url_for('index')}}" class="nav-link px-2 link-secondary">Main</a></li>
            <li><a href="{{url_for('about')}}" class="nav-link px-2">About</a></li>
            <li><a href="{{url_for('create')}}" class="nav-link px-2">Add a vehicle</a></li>
            <li><a href="{{url_for('posts')}}" class="nav-link px-2">All entries</a></li>
        </ul>

            <div class="col-md-3 text-end">

    {% if session.username %}
        <span class="me-3">Привет, {{ session.username }}!</span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger me-2">
            Выход
        </a>
    {% else %}
        <a href="{{ url_for('login') }}" class="btn btn-outline-primary me-2">
            Login
        </a>

        <a href="{{ url_for('register') }}" class="btn btn-primary">
            Sign-up
        </a>
    {% endif %}

            </div>

         <div class = "switch-style">
                <span class = "button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="var(--color-switcher)" class="bi bi-sun-fill" viewBox="0 0 16 16">
                        <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
                    </svg>
                </span>
         </div>

    </header>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <footer class="d-flex flex-warp justify-content-between align-items-center py3 my-4 border-top">
        <div class="col-md-4 d-flex align-items-center">
            <a href="/" class="mb-3 me-2 mb-md-0 text-muted text-decorarion-none lh-1">
                <img class="footer__img" src=" {{ url_for('static', filename = 'img/carrent.png') }}" alt="carrent">
            </a>
            <span class="mb-3 mb-md text-muted">Переходите в наш телеграмм канал</span>
        </div>

        <a href="#" class="mb-3 me-2 mb-md-0 text-muted text-decorarion-none lh-1">
            <img class="tg__img" src="{{ url_for('static', filename='img/tg.png')}}" alt="telegram">
        </a>
    </footer>
</div>
<!--
 href="{{ url_for('static', filename='css/main.css') }}">-->
<script src="{{ url_for('static', filename='js/switchstyle.js') }}"></script>
</body>
</html>
